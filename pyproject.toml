[project]
name = "quillstack-dotenv"
version = "0.1.2"
description = "Reads a .env file. Values keep the type they plainly have, and nothing is expanded unless you ask for it."
readme = "README.md"
license = "MIT"
authors = [{ name = "Radek Ziemniewicz", email = "radek@quillstack.org" }]
requires-python = ">=3.11"
keywords = ["dotenv", "env", "configuration", "quillstack", "python3"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://quillstack.org/python/packages/dotenv"
Source = "https://github.com/quillstack-py/dotenv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "quillstack-standards>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quillstack"]

[tool.hatch.build.targets.wheel.force-include]
"src/quillstack/dotenv/py.typed" = "quillstack/dotenv/py.typed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
